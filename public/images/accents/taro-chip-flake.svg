<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flakeChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF"/>
      <stop offset="50%" stop-color="#F3DCB4"/>
      <stop offset="100%" stop-color="#D7AB69"/>
    </linearGradient>
    <linearGradient id="flakeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B4E8C"/>
      <stop offset="100%" stop-color="#4A235D"/>
    </linearGradient>
    <filter id="flakeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#2D1A0E" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Single curled crispy taro slice -->
  <g filter="url(#flakeShadow)" transform="translate(15, 10)">
    <path d="M 10 45 C 18 12, 70 -5, 105 15 C 128 35, 120 78, 92 88 C 50 100, -8 72, 10 45 Z"
          fill="url(#flakeChip)" stroke="url(#flakeSkin)" stroke-width="3"/>
    <path d="M 28 38 Q 62 48 98 40 M 35 62 Q 68 58 88 74"
          stroke="#7A458E" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
