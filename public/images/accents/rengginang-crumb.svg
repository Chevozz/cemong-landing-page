<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="100%" height="100%">
  <defs>
    <linearGradient id="crumbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E5"/>
      <stop offset="40%" stop-color="#F2D296"/>
      <stop offset="100%" stop-color="#BE873B"/>
    </linearGradient>
    <filter id="crumbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#2D1A0E" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Cluster of puffed crispy rice grains -->
  <g filter="url(#crumbShadow)" transform="translate(10, 8)">
    <ellipse cx="60" cy="45" rx="42" ry="32" fill="#B07C35"/>
    <ellipse cx="60" cy="45" rx="39" ry="29" fill="url(#crumbGold)" stroke="#A06822" stroke-width="1.5"/>
    <!-- Puffed grain bumps -->
    <g fill="#FFFDF8" stroke="#B07C35" stroke-width="1.2">
      <ellipse cx="45" cy="38" rx="8" ry="5" transform="rotate(25 45 38)"/>
      <ellipse cx="62" cy="35" rx="8" ry="5" transform="rotate(-15 62 35)"/>
      <ellipse cx="78" cy="42" rx="7" ry="5" transform="rotate(30 78 42)"/>
      <ellipse cx="50" cy="52" rx="8" ry="5" transform="rotate(-30 50 52)"/>
      <ellipse cx="68" cy="55" rx="8" ry="5" transform="rotate(15 68 55)"/>
    </g>
  </g>
</svg>
