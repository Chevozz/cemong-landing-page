<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background & shadows -->
    <radialGradient id="heroBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="60%" stop-color="#F3ECE1"/>
      <stop offset="100%" stop-color="#E5D9C8"/>
    </radialGradient>
    <radialGradient id="tampahShadow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="rgba(45,35,25,0.35)"/>
      <stop offset="60%" stop-color="rgba(45,35,25,0.15)"/>
      <stop offset="100%" stop-color="rgba(45,35,25,0)"/>
    </radialGradient>
    <linearGradient id="bananaLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F7A3E"/>
      <stop offset="45%" stop-color="#559448"/>
      <stop offset="85%" stop-color="#396E37"/>
      <stop offset="100%" stop-color="#2D582C"/>
    </linearGradient>
    <linearGradient id="bambooRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88A58"/>
      <stop offset="30%" stop-color="#D7A977"/>
      <stop offset="70%" stop-color="#C29462"/>
      <stop offset="100%" stop-color="#9C7244"/>
    </linearGradient>
    <linearGradient id="taroChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3DC"/>
      <stop offset="40%" stop-color="#F6DEB5"/>
      <stop offset="80%" stop-color="#E5BE82"/>
      <stop offset="100%" stop-color="#C99B58"/>
    </linearGradient>
    <linearGradient id="taroSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B4E8C"/>
      <stop offset="60%" stop-color="#5B336E"/>
      <stop offset="100%" stop-color="#3B1C4B"/>
    </linearGradient>
    <linearGradient id="rengginangGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E6C3"/>
      <stop offset="30%" stop-color="#E9C98A"/>
      <stop offset="70%" stop-color="#CF9D50"/>
      <stop offset="100%" stop-color="#A5732D"/>
    </linearGradient>
    <linearGradient id="rengginangDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A963"/>
      <stop offset="100%" stop-color="#8C571D"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3D2615" flood-opacity="0.18"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#2D1A0E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#heroBg)"/>

  <!-- Subtle rustic woven table texture ring -->
  <circle cx="400" cy="320" r="275" fill="none" stroke="#E2D4C0" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="400" cy="320" r="290" fill="none" stroke="#E2D4C0" stroke-width="1" stroke-dasharray="12 8" opacity="0.4"/>

  <!-- Shadow below Tampah -->
  <ellipse cx="400" cy="345" rx="275" ry="185" fill="url(#tampahShadow)"/>

  <!-- Tampah (Bamboo Tray) Outer Rim -->
  <g filter="url(#softGlow)">
    <ellipse cx="400" cy="320" rx="255" ry="170" fill="#C99A66" stroke="#8E6335" stroke-width="6"/>
    <ellipse cx="400" cy="320" rx="248" ry="164" fill="#DEC095" stroke="#A87B49" stroke-width="3"/>

    <!-- Woven bamboo inner base -->
    <ellipse cx="400" cy="320" rx="240" ry="156" fill="#D3AA78"/>

    <!-- Woven pattern lines across base -->
    <g opacity="0.25" stroke="#7A5328" stroke-width="1.2">
      <path d="M 190 260 L 610 380 M 170 300 L 630 340 M 180 340 L 620 300 M 210 380 L 590 260"/>
      <path d="M 280 180 L 520 460 M 340 170 L 460 470 M 400 165 L 400 475 M 460 170 L 340 470 M 520 180 L 280 460"/>
    </g>

    <!-- Banana Leaf Base (Alas Daun Pisang) -->
    <path d="M 200 310 C 210 210, 310 190, 420 195 C 550 200, 600 270, 595 345 C 590 415, 480 445, 370 440 C 260 435, 190 390, 200 310 Z"
          fill="url(#bananaLeaf)" stroke="#2F5C2D" stroke-width="1.5"/>

    <!-- Banana Leaf Veins -->
    <path d="M 220 315 Q 395 315 575 320" fill="none" stroke="#2B5228" stroke-width="2.5" opacity="0.6"/>
    <g fill="none" stroke="#4C8545" stroke-width="1" opacity="0.45">
      <path d="M 260 315 L 290 230 M 320 315 L 360 220 M 380 316 L 430 215 M 450 317 L 500 230 M 510 318 L 550 255"/>
      <path d="M 260 315 L 285 395 M 320 315 L 350 415 M 380 316 L 420 425 M 450 317 L 490 410 M 510 318 L 545 385"/>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: KERIPIK TALAS (TARO CHIPS) ==================== -->
  <g id="keripikTalasGroup" filter="url(#chipShadow)">
    <!-- Chip 1 (bottom left) -->
    <g transform="translate(230, 310) rotate(-18)">
      <path d="M 0 35 C 10 10, 50 -5, 80 10 C 105 25, 95 65, 75 75 C 45 90, -10 60, 0 35 Z" fill="url(#taroChip)" stroke="url(#taroSkin)" stroke-width="3"/>
      <!-- Purple veins on taro -->
      <path d="M 20 25 Q 45 35 70 30 M 30 50 Q 55 45 75 55" stroke="#89569B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Chip 2 (bottom center-left) -->
    <g transform="translate(280, 335) rotate(15)">
      <path d="M 5 30 C 15 5, 60 -10, 95 8 C 120 25, 110 70, 85 85 C 50 100, -5 65, 5 30 Z" fill="url(#taroChip)" stroke="url(#taroSkin)" stroke-width="3.5"/>
      <path d="M 25 22 Q 55 35 90 28 M 35 55 Q 65 48 88 62" stroke="#7A428E" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
    </g>

    <!-- Chip 3 (stacked middle) -->
    <g transform="translate(245, 260) rotate(32)">
      <path d="M 0 35 C 8 8, 55 -5, 85 15 C 110 32, 100 70, 75 80 C 40 92, -8 62, 0 35 Z" fill="url(#taroChip)" stroke="url(#taroSkin)" stroke-width="3"/>
      <path d="M 20 28 Q 50 38 80 32 M 28 52 Q 58 50 78 65" stroke="#89569B" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Chip 4 (top prominent curled taro chip) -->
    <g transform="translate(295, 235) rotate(-8)">
      <path d="M 0 40 C 12 5, 70 -12, 105 12 C 130 32, 120 80, 90 92 C 50 105, -12 75, 0 40 Z" fill="url(#taroChip)" stroke="url(#taroSkin)" stroke-width="4"/>
      <!-- Characteristic purple taro fibers -->
      <path d="M 18 35 Q 60 48 102 38" stroke="#6F3982" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M 32 20 Q 72 32 98 62" stroke="#8A4FA0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M 28 65 Q 65 60 92 78" stroke="#6F3982" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
      <!-- Crispy browned highlights -->
      <path d="M 75 8 C 95 18, 105 38, 98 52" stroke="#B07C35" stroke-width="2" fill="none" opacity="0.6"/>
    </g>

    <!-- Chip 5 (stacked foreground chip) -->
    <g transform="translate(260, 280) rotate(-28)">
      <path d="M 5 32 C 18 10, 65 0, 92 20 C 115 38, 102 75, 78 82 C 45 92, -6 60, 5 32 Z" fill="#FDECCB" stroke="url(#taroSkin)" stroke-width="3.2"/>
      <path d="M 25 30 Q 55 42 85 35 M 32 55 Q 62 52 80 68" stroke="#7E4793" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Scattered small crispy chips & crumbs -->
    <g transform="translate(210, 370) rotate(40)">
      <ellipse cx="15" cy="12" rx="18" ry="10" fill="#E8C488" stroke="#6F3982" stroke-width="2"/>
    </g>
    <g transform="translate(365, 365) rotate(-15)">
      <ellipse cx="12" cy="8" rx="14" ry="7" fill="#E8C488" stroke="#6F3982" stroke-width="1.8"/>
    </g>
    <circle cx="205" cy="355" r="2.5" fill="#D29A4D"/>
    <circle cx="225" cy="385" r="3" fill="#6A4C93" opacity="0.8"/>
    <circle cx="350" cy="390" r="2" fill="#D29A4D"/>
  </g>

  <!-- ==================== RIGHT SIDE: RENGGINANG (CRISPY PUFFED RICE) ==================== -->
  <g id="rengginangGroup" filter="url(#chipShadow)">
    <!-- Rengginang Base Cake 1 (Bottom Right) -->
    <g transform="translate(460, 290) rotate(12)">
      <ellipse cx="65" cy="55" rx="72" ry="58" fill="url(#rengginangDark)"/>
      <ellipse cx="65" cy="55" rx="68" ry="54" fill="url(#rengginangGold)"/>
      <!-- Puffed rice grain cluster bumps -->
      <g fill="#FDECCB" stroke="#B6823B" stroke-width="1.2">
        <ellipse cx="35" cy="35" rx="9" ry="6"/>
        <ellipse cx="50" cy="30" rx="8" ry="6" transform="rotate(15 50 30)"/>
        <ellipse cx="70" cy="28" rx="9" ry="7" transform="rotate(-20 70 28)"/>
        <ellipse cx="90" cy="38" rx="8" ry="6" transform="rotate(35 90 38)"/>
        <ellipse cx="40" cy="52" rx="9" ry="6" transform="rotate(-15 40 52)"/>
        <ellipse cx="60" cy="48" rx="10" ry="7"/>
        <ellipse cx="80" cy="50" rx="9" ry="6" transform="rotate(25 80 50)"/>
        <ellipse cx="100" cy="58" rx="8" ry="6"/>
        <ellipse cx="30" cy="68" rx="8" ry="6" transform="rotate(40 30 68)"/>
        <ellipse cx="50" cy="70" rx="9" ry="7" transform="rotate(-10 50 70)"/>
        <ellipse cx="72" cy="72" rx="10" ry="6" transform="rotate(15 72 72)"/>
        <ellipse cx="92" cy="75" rx="8" ry="6" transform="rotate(-25 92 75)"/>
        <ellipse cx="45" cy="88" rx="8" ry="5"/>
        <ellipse cx="68" cy="88" rx="9" ry="6" transform="rotate(20 68 88)"/>
      </g>
    </g>

    <!-- Rengginang Cake 2 (Main Foreground Crunchy Round) -->
    <g transform="translate(400, 230) rotate(-10)">
      <ellipse cx="75" cy="65" rx="82" ry="66" fill="#A87532"/>
      <ellipse cx="75" cy="65" rx="78" ry="62" fill="url(#rengginangGold)" stroke="#966324" stroke-width="2"/>
      <!-- Detailed crisp puffed rice grains texture -->
      <g fill="#FFF1D7" stroke="#A97530" stroke-width="1.3">
        <!-- Center cluster -->
        <ellipse cx="75" cy="65" rx="11" ry="7" transform="rotate(12 75 65)"/>
        <ellipse cx="60" cy="60" rx="10" ry="7" transform="rotate(-25 60 60)"/>
        <ellipse cx="90" cy="62" rx="10" ry="6" transform="rotate(30 90 62)"/>
        <ellipse cx="72" cy="48" rx="10" ry="6" transform="rotate(-5 72 48)"/>
        <ellipse cx="78" cy="80" rx="11" ry="7" transform="rotate(18 78 80)"/>

        <!-- Ring 1 -->
        <ellipse cx="42" cy="48" rx="9" ry="6" transform="rotate(40 42 48)"/>
        <ellipse cx="55" cy="38" rx="10" ry="7" transform="rotate(-15 55 38)"/>
        <ellipse cx="95" cy="45" rx="9" ry="6" transform="rotate(-30 95 45)"/>
        <ellipse cx="110" cy="55" rx="9" ry="6" transform="rotate(22 110 55)"/>
        <ellipse cx="45" cy="75" rx="9" ry="6" transform="rotate(-35 45 75)"/>
        <ellipse cx="60" cy="88" rx="10" ry="6" transform="rotate(15 60 88)"/>
        <ellipse cx="98" cy="78" rx="10" ry="7" transform="rotate(-18 98 78)"/>
        <ellipse cx="112" cy="72" rx="8" ry="6" transform="rotate(40 112 72)"/>

        <!-- Outer bumps showing crispy irregular edge -->
        <ellipse cx="25" cy="58" rx="8" ry="5" transform="rotate(25 25 58)"/>
        <ellipse cx="32" cy="40" rx="8" ry="6" transform="rotate(-20 32 40)"/>
        <ellipse cx="78" cy="28" rx="9" ry="6" transform="rotate(5 78 28)"/>
        <ellipse cx="120" cy="48" rx="7" ry="5" transform="rotate(45 120 48)"/>
        <ellipse cx="125" cy="65" rx="8" ry="5"/>
        <ellipse cx="118" cy="85" rx="8" ry="6" transform="rotate(-25 118 85)"/>
        <ellipse cx="90" cy="98" rx="9" ry="6" transform="rotate(30 90 98)"/>
        <ellipse cx="42" cy="95" rx="8" ry="5" transform="rotate(-15 42 95)"/>
        <ellipse cx="28" cy="78" rx="8" ry="5" transform="rotate(35 28 78)"/>
      </g>
      <!-- Deep golden crisp spots -->
      <g fill="#945F20" opacity="0.65">
        <circle cx="50" cy="52" r="2.5"/>
        <circle cx="85" cy="55" r="2"/>
        <circle cx="68" cy="75" r="2.2"/>
        <circle cx="102" cy="68" r="2"/>
        <circle cx="48" cy="70" r="1.8"/>
      </g>
    </g>

    <!-- Scattered puffed rice grains -->
    <ellipse cx="375" cy="335" rx="6" ry="4" fill="#FDECCB" stroke="#B6823B" stroke-width="1" transform="rotate(25 375 335)"/>
    <ellipse cx="390" cy="355" rx="5" ry="3.5" fill="#FDECCB" stroke="#B6823B" stroke-width="1" transform="rotate(-40 390 355)"/>
    <ellipse cx="545" cy="365" rx="6" ry="4" fill="#FDECCB" stroke="#B6823B" stroke-width="1" transform="rotate(15 545 365)"/>
  </g>

  <!-- ==================== STAMP / BADGE (Craft Accent) ==================== -->
  <g transform="translate(130, 85)" filter="url(#softGlow)">
    <!-- Wavy seal background -->
    <rect x="0" y="0" width="180" height="66" rx="8" fill="#6A4C93" stroke="#FAF7F2" stroke-width="2"/>
    <rect x="4" y="4" width="172" height="58" rx="6" fill="none" stroke="#D4A373" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="90" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#EBD99F" text-anchor="middle" letter-spacing="1.5">
      KUDAPAN GURIH
    </text>
    <text x="90" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      Olahan Rumahan
    </text>
  </g>

  <!-- Floating label at bottom-right for food recognition -->
  <g transform="translate(510, 485)" filter="url(#softGlow)">
    <rect x="0" y="0" width="200" height="54" rx="8" fill="#FFFFFF" stroke="#E7E2DD" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="14" fill="#EFE8F5"/>
    <!-- Small snack bowl icon -->
    <path d="M 20 27 C 20 33, 36 33, 36 27 Z" fill="#6A4C93"/>
    <path d="M 18 25 Q 28 23 38 25" stroke="#D4A373" stroke-width="2" fill="none"/>
    <text x="52" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2D2D2D">
      Talas &amp; Rengginang
    </text>
    <text x="52" y="41" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#737373">
      Digoreng renyah &amp; gurih
    </text>
  </g>
</svg>
