<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="storyBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="60%" stop-color="#F2ECE0"/>
      <stop offset="100%" stop-color="#E2D6C0"/>
    </radialGradient>
    <linearGradient id="kraftBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7A374"/>
      <stop offset="35%" stop-color="#DFBD91"/>
      <stop offset="70%" stop-color="#D0A878"/>
      <stop offset="100%" stop-color="#B28A58"/>
    </linearGradient>
    <filter id="bagShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2D1A0E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="500" fill="url(#storyBg)"/>

  <!-- Warm Wooden/Stone Surface Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="40" fill="rgba(45,35,25,0.2)"/>

  <!-- Standing Kraft Paper Pouch (Kemasan Cem'ong) -->
  <g filter="url(#bagShadow)">
    <!-- Bag silhouette with folded top -->
    <path d="M 210 140 L 390 140 L 415 390 C 415 405, 395 415, 300 415 C 205 415, 185 405, 185 390 Z"
          fill="url(#kraftBag)" stroke="#9C7343" stroke-width="2.5"/>

    <!-- Heat-sealed zip top -->
    <rect x="200" y="140" width="200" height="24" rx="3" fill="#A87E4B" stroke="#8A6335" stroke-width="1.5"/>
    <line x1="205" y1="152" x2="395" y2="152" stroke="#6F4D24" stroke-width="1.2" stroke-dasharray="3 2"/>

    <!-- Clear front window showing crispy taro chips -->
    <ellipse cx="300" cy="275" rx="72" ry="60" fill="#2D2116" stroke="#A87E4B" stroke-width="3"/>
    <ellipse cx="300" cy="275" rx="68" ry="56" fill="#F4EDE0" opacity="0.95"/>

    <!-- Chips visible inside window -->
    <g transform="translate(255, 235)">
      <ellipse cx="35" cy="28" rx="26" ry="16" fill="#FFEBC9" stroke="#7A428E" stroke-width="2" transform="rotate(-15 35 28)"/>
      <ellipse cx="55" cy="48" rx="28" ry="18" fill="#FCE2B6" stroke="#7A428E" stroke-width="2" transform="rotate(20 55 48)"/>
      <ellipse cx="32" cy="55" rx="24" ry="15" fill="#FFF2DC" stroke="#7A428E" stroke-width="2" transform="rotate(-8 32 55)"/>
      <path d="M 22 28 Q 42 35 60 28 M 28 55 Q 48 50 65 60" stroke="#7A428E" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Kraft label badge -->
    <rect x="235" y="175" width="130" height="42" rx="4" fill="#FFFFFF" stroke="#D1C3B0" stroke-width="1.5"/>
    <text x="300" y="196" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#6A4C93" text-anchor="middle">
      Cem'ong
    </text>
    <text x="300" y="210" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#78716C" text-anchor="middle" letter-spacing="0.5">
      KERIPIK TALAS RUMAHAN
    </text>
  </g>

  <!-- Beside the pouch: crispy taro chips spilled freshly -->
  <g transform="translate(145, 345) rotate(-22)">
    <path d="M 0 28 C 8 8, 42 -5, 68 10 C 88 22, 80 58, 62 68 C 35 78, -8 52, 0 28 Z"
          fill="#FFF2DB" stroke="#6F3982" stroke-width="2.5"/>
    <path d="M 18 22 Q 45 30 65 25" stroke="#7A428E" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <g transform="translate(395, 360) rotate(18)">
    <ellipse cx="35" cy="28" rx="36" ry="26" fill="#F4D396" stroke="#9A6520" stroke-width="2"/>
    <g fill="#FFF8EE" stroke="#A97530" stroke-width="1">
      <ellipse cx="25" cy="22" rx="7" ry="4"/>
      <ellipse cx="42" cy="20" rx="7" ry="4"/>
      <ellipse cx="32" cy="34" rx="7" ry="4"/>
      <ellipse cx="48" cy="35" rx="6" ry="4"/>
    </g>
  </g>
</svg>
